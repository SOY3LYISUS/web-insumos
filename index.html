<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora Médica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 class="fade-in">Suministros Médicos de Alta Calidad</h1>
        <nav>
            <a href="#multimedia">Demostración</a> | 
            <a href="#galeria">Equipos</a> | 
            <a href="#catalogo">Catálogo Completo</a>
        </nav>
    </header>

    <main>
        <!-- Sección del Video -->
        <section id="multimedia">
            <h2>Demostración de Funcionalidad</h2>
            <video width="80%" controls muted>
                <!-- AQUÍ CAMBIAS EL VIDEO: Reemplaza el enlace por el nombre de tu archivo (ej. "mi-video.mp4") -->
                <source src="<source src="pinza.mp4" type="video/mp4">" type="video/mp4">
                Tu navegador no soporta videos.
            </video>
        </section>

        <!-- Nueva Sección: Recuadros de Imágenes -->
        <section id="galeria">
            <h2>Galería de Equipos Médicos</h2>
            <div class="grid-imagenes">
                <!-- Recuadro 1 -->
                <div class="recuadro">
                    <img src="https://via.placeholder.com/300x200?text=Monitor+Signos+Vitales" alt="Monitor">
                    <h3>Monitor de Signos Vitales</h3>
                </div>
                <!-- Recuadro 2 -->
                <div class="recuadro">
                    <img src="https://via.placeholder.com/300x200?text=Maquina+Anestesia" alt="Anestesia">
                    <h3>Máquina de Anestesia</h3>
                </div>
                <!-- Recuadro 3 -->
                <div class="recuadro">
                    <img src="https://via.placeholder.com/300x200?text=Torre+Endoscopia" alt="Endoscopia">
                    <h3>Torre de Endoscopia</h3>
                </div>
            </div>
        </section>

        <section id="catalogo">
            <h2>Catálogo Dinámico (Fetch API)</h2>
            <div id="lista-productos">Cargando productos...</div>
            <button id="cargar-btn">Recargar Catálogo</button>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
